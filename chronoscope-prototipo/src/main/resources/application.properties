spring.application.name=chronoscope-prototipo
server.port=8080

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.packages-to-scan=co.edu.unbosque.chronoscope.controller

# Parametros del negocio (RF-17, RF-18): se cambian aqui sin tocar codigo
chronoscope.cupo-maximo=40
chronoscope.tolerancia-porcentaje=10
chronoscope.minimo-estudiantes=12

# Mostrar el motivo de los errores (ej. "hay 2 conflictos duros") en la respuesta
server.error.include-message=always
spring.jackson.serialization.write-dates-as-timestamps=false
